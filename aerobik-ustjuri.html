<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const db=getDatabase(initializeApp({apiKey:"AIzaSyDRcNy7IwpKhpYgRlaoo5BD8FL4myhklYY",authDomain:"analig.firebaseapp.com",databaseURL:"https://analig-default-rtdb.firebaseio.com",projectId:"analig",storageBucket:"analig.firebasestorage.app",messagingSenderId:"724523220392",appId:"1:724523220392:web:5141cbdb98d5c85f9cb19d"}));
const p=new URLSearchParams(location.search), comp=p.get("compId")||p.get("competitionId");
if(!comp){location.replace("/");}
else{get(ref(db,`aerobik_yarismalar/${comp}/epanelToken`)).then(s=>{const t=s.val()||"";location.replace(`/aerobik/ustjuri?competitionId=${encodeURIComponent(comp)}&token=${encodeURIComponent(t)}`);}).catch(()=>location.replace(`/aerobik/ustjuri?competitionId=${encodeURIComponent(comp)}`));}
