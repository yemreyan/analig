<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARŞİV — TCF</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0e1a;--panel:#131a2b;--panel2:#1b2438;--line:#2a3550;--txt:#e8edf7;--muted:#8b97b3;--accent:#6366f1;--warn:#ef4444;--ok:#22c55e;--gold:#fbbf24}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:rgba(10,14,26,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:.7rem 1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.55rem;font-weight:800;font-size:1.05rem}
.brand .material-icons-round{color:var(--gold)}
.wrap{max-width:960px;margin:0 auto;padding:1rem}
/* şifre kapısı */
.gate{max-width:420px;margin:6vh auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1.6rem}
.gate h2{font-size:1.15rem;font-weight:800;margin-bottom:.4rem;display:flex;align-items:center;gap:.5rem}
.gate p{color:var(--muted);font-size:.85rem;font-weight:600;margin-bottom:1rem}
.gate input{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem;font:inherit;font-size:.95rem;margin-bottom:.7rem}
.gate input:focus{outline:2px solid var(--accent)}
.gate button{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:.75rem;font:inherit;font-weight:800;cursor:pointer}
.gate .err{color:#fca5a5;font-size:.82rem;font-weight:700;min-height:1.1rem;margin-bottom:.4rem}
.tabs{display:flex;gap:.5rem;margin-bottom:1rem}
.tab{background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:.5rem 1rem;font:inherit;font-weight:800;font-size:.85rem;cursor:pointer}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab .cnt{opacity:.8;font-weight:700}
.list{display:flex;flex-direction:column;gap:.6rem}
.row{display:flex;align-items:center;gap:1rem;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem}
.row-info{flex:1;min-width:0}
.row-name{font-weight:800;font-size:1.02rem}
.row-sub{color:var(--muted);font-size:.8rem;font-weight:600;margin-top:.15rem}
.btn{display:flex;align-items:center;gap:.35rem;border:none;border-radius:10px;padding:.6rem .9rem;font:inherit;font-weight:800;font-size:.85rem;cursor:pointer;white-space:nowrap;color:#fff}
.btn-arch{background:var(--gold);color:#3a2c00}
.btn-restore{background:var(--ok)}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default}
.empty{text-align:center;color:var(--muted);padding:3rem 1rem;font-weight:600}
.empty .material-icons-round{font-size:2.4rem;opacity:.4;display:block;margin-bottom:.6rem}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:.7rem 1.1rem;border-radius:12px;font-weight:700;font-size:.9rem;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}.toast.ok{border-color:var(--ok);color:#86efac}.toast.err{border-color:var(--warn);color:#fca5a5}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><span class="material-icons-round">inventory_2</span> ARŞİV</div>
  <span id="who" style="margin-left:auto;color:var(--muted);font-weight:700;font-size:.82rem"></span>
</div>

<div id="gate" class="gate">
  <h2><span class="material-icons-round" style="color:var(--gold)">lock</span> Süper Admin Doğrulama</h2>
  <p>Arşiv işlemleri için süper admin şifresi gerekir.</p>
  <div id="gateErr" class="err"></div>
  <input id="pw" type="password" placeholder="Süper admin şifresi" autocomplete="current-password">
  <button id="unlock">Giriş</button>
</div>

<div id="app" class="wrap hidden">
  <div class="tabs">
    <button class="tab active" data-tab="active">Aktif <span class="cnt" id="cntA">(0)</span></button>
    <button class="tab" data-tab="arsiv">Arşiv <span class="cnt" id="cntR">(0)</span></button>
  </div>
  <div id="list" class="list"></div>
</div>
<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, get, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyDRcNy7IwpKhpYgRlaoo5BD8FL4myhklYY",
  authDomain: "analig.firebaseapp.com",
  databaseURL: "https://analig-default-rtdb.firebaseio.com",
  projectId: "analig",
  storageBucket: "analig.firebasestorage.app",
  messagingSenderId: "724523220392",
  appId: "1:724523220392:web:5141cbdb98d5c85f9cb19d"
};
const db = getDatabase(initializeApp(firebaseConfig));
const FB = "competitions";
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/</g,"&lt;");
let comps = {}, tab = "active";

function toast(msg, type){ const t=$("toast"); t.textContent=msg; t.className="toast show "+(type||""); setTimeout(()=>t.className="toast",2200); }

// --- SHA-256 (uygulama ile aynı) ---
async function sha256hex(s){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

async function verifySuperAdmin(pw){
  const snap = await get(ref(db, "kullanicilar"));
  const users = snap.val() || {};
  const h = await sha256hex(pw);
  for(const [id,u] of Object.entries(users)){
    if(!u || typeof u!=="object") continue;
    if(u.rolAdi==="Super Admin" || id==="admin"){
      if(u.sifreHash && u.sifreHash===h) return true;
      if(u.sifre && u.sifre===pw) return true;
    }
  }
  return false;
}

$("unlock").addEventListener("click", doUnlock);
$("pw").addEventListener("keydown", e=>{ if(e.key==="Enter") doUnlock(); });

async function doUnlock(){
  const pw = $("pw").value;
  if(!pw){ $("gateErr").textContent="Şifre girin."; return; }
  $("unlock").disabled=true; $("gateErr").textContent="Doğrulanıyor…";
  try{
    const ok = await verifySuperAdmin(pw);
    if(ok){
      sessionStorage.setItem("arsiv_ok","1");
      openApp();
    } else {
      $("gateErr").textContent="Şifre hatalı.";
    }
  }catch(err){ $("gateErr").textContent="Hata: "+(err?.message||err); }
  $("unlock").disabled=false;
}

function openApp(){
  $("gate").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("who").textContent="Süper Admin";
  onValue(ref(db, FB), s=>{ comps = s.val() || {}; render(); });
}

document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click", ()=>{
  tab=b.dataset.tab;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));
  render();
}));

function render(){
  const all = Object.entries(comps).filter(([id,c])=>c&&(c.kategoriler||c.isim||c.ad))
    .sort((a,b)=>(b[1].baslangicTarihi||"").localeCompare(a[1].baslangicTarihi||""));
  const active = all.filter(([id,c])=>!c.arsivli);
  const arsiv  = all.filter(([id,c])=>c.arsivli);
  $("cntA").textContent=`(${active.length})`;
  $("cntR").textContent=`(${arsiv.length})`;
  const rows = tab==="active" ? active : arsiv;
  if(!rows.length){
    $("list").innerHTML=`<div class="empty"><span class="material-icons-round">${tab==="active"?"event_available":"inventory_2"}</span>${tab==="active"?"Aktif yarışma yok":"Arşivde yarışma yok"}</div>`;
    return;
  }
  $("list").innerHTML = rows.map(([id,c])=>{
    const name = esc(c.isim||c.ad||id);
    const date = c.baslangicTarihi ? new Date(c.baslangicTarihi).toLocaleDateString("tr-TR") : "";
    const kat = c.kategoriler ? Object.keys(c.kategoriler).length : 0;
    const btn = tab==="active"
      ? `<button class="btn btn-arch" data-id="${id}" data-act="arch"><span class="material-icons-round" style="font-size:1.1rem">archive</span> Arşive Al</button>`
      : `<button class="btn btn-restore" data-id="${id}" data-act="restore"><span class="material-icons-round" style="font-size:1.1rem">unarchive</span> Arşivden Çıkar</button>`;
    return `<div class="row"><div class="row-info"><div class="row-name">${name}</div><div class="row-sub">${date}${date&&kat?" · ":""}${kat?kat+" kategori":""}</div></div>${btn}</div>`;
  }).join("");
  $("list").querySelectorAll(".btn").forEach(b=>b.addEventListener("click", ()=>doArchive(b)));
}

async function doArchive(btn){
  const id=btn.dataset.id, act=btn.dataset.act;
  const name=(comps[id]?.isim||comps[id]?.ad||id);
  const arch = act==="arch";
  if(!confirm(`"${name}" yarışması ${arch?"ARŞİVE alınacak":"arşivden ÇIKARILACAK"}.\n\nOnaylıyor musun?`)) return;
  btn.disabled=true;
  try{
    await set(ref(db, `${FB}/${id}/arsivli`), arch ? true : null);
    toast(arch?"Arşive alındı ✓":"Arşivden çıkarıldı ✓","ok");
  }catch(err){ toast("Hata: "+(err?.message||err),"err"); btn.disabled=false; }
}

// oturumda daha önce doğrulandıysa direkt aç
if(sessionStorage.getItem("arsiv_ok")==="1") openApp();
</script>
</body>
</html>
