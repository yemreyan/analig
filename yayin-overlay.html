<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yayın Overlay — Gymexa Score · TCF</title>
<link rel="icon" type="image/svg+xml" href="/brand/gymnaxis-favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<style>
/* =====================================================================
   TCF YAYIN OVERLAY
   - Parametresiz: kurulum ekranı (link üretir + önizleme)
   - ?comp=<id>: OBS / vMix "Tarayıcı Kaynağı" için şeffaf overlay
   Yalnızca OKUR: aktifSporcu (çağrılan sporcu) ve flashTrigger (yayınlanan puan).
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0b1f4b;--navy2:#13306e;--red:#e30613;--gold:#fbbf24;--txt:#fff;--muted:#c7d2fe}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif}

/* ---------- OVERLAY ---------- */
body.ov{background:transparent!important;overflow:hidden}
/* 1920x1080 tasarim; --s ile olceklenir */
.stage{position:fixed;inset:0;pointer-events:none;--s:calc(100vw/1920)}
.lt{position:absolute;display:flex;align-items:stretch;filter:drop-shadow(0 calc(10*var(--s)) calc(24*var(--s)) rgba(0,0,0,.45));
 transform:translateY(calc(40*var(--s)));opacity:0;transition:transform .55s cubic-bezier(.2,.9,.25,1),opacity .45s ease}
.lt.on{transform:none;opacity:1}
.pos-alt-sol .lt{left:calc(90*var(--s));bottom:calc(90*var(--s))}
.pos-alt-orta .lt{left:50%;bottom:calc(80*var(--s));transform:translate(-50%,calc(40*var(--s)))}
.pos-alt-orta .lt.on{transform:translate(-50%,0)}
.pos-ust-sol .lt{left:calc(90*var(--s));top:calc(70*var(--s));transform:translateY(calc(-40*var(--s)))}
.pos-ust-sol .lt.on{transform:none}
.logo{width:calc(160*var(--s));background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(8*var(--s));padding:calc(10*var(--s)) 0;border-radius:calc(14*var(--s)) 0 0 calc(14*var(--s))}
.logo img{width:62%;height:auto}
.logo img.gx{width:86%}
.body{background:linear-gradient(135deg,var(--navy),var(--navy2));color:var(--txt);padding:calc(16*var(--s)) calc(34*var(--s)) calc(18*var(--s)) calc(30*var(--s));
 border-left:calc(8*var(--s)) solid var(--red);min-width:calc(720*var(--s));max-width:calc(1180*var(--s));display:flex;flex-direction:column;justify-content:center}
.cat{font-size:calc(22*var(--s));font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:calc(4*var(--s));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name{font-size:calc(50*var(--s));font-weight:800;line-height:1.08;letter-spacing:.01em;text-transform:uppercase}
.name.uzun{font-size:calc(36*var(--s))}
.name.cokuzun{font-size:calc(27*var(--s))}
.club{font-size:calc(25*var(--s));font-weight:600;color:var(--muted);margin-top:calc(6*var(--s));text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{display:none;background:#fff;color:var(--navy);border-radius:0 calc(14*var(--s)) calc(14*var(--s)) 0;padding:calc(12*var(--s)) calc(30*var(--s));
 flex-direction:column;align-items:center;justify-content:center;min-width:calc(250*var(--s))}
.lt.puanli .score{display:flex}
.lt:not(.puanli) .body{border-radius:0 calc(14*var(--s)) calc(14*var(--s)) 0}
.slbl{font-size:calc(18*var(--s));font-weight:800;letter-spacing:.12em;color:#64748b}
.stot{font-size:calc(72*var(--s));font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:calc(10*var(--s));margin-top:calc(12*var(--s));flex-wrap:wrap}
.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:calc(8*var(--s));padding:calc(5*var(--s)) calc(12*var(--s));font-size:calc(22*var(--s));font-weight:700;font-variant-numeric:tabular-nums}
.chip b{color:var(--gold);margin-right:calc(6*var(--s));font-weight:800}
.chip.ded b{color:#fca5a5}
.rank{margin-top:calc(8*var(--s));background:var(--red);color:#fff;border-radius:calc(8*var(--s));padding:calc(4*var(--s)) calc(14*var(--s));font-size:calc(22*var(--s));font-weight:800;letter-spacing:.06em}

/* ---------- KURULUM (ana sayfa tasarım dili) ---------- */
body.kur{--bg:#F0F2F5;--line:#E5E7EB;--ink:#1A1D26;--muted:#6B7280;--soft:#F8FAFC;--p:#10B981;--p-rgb:16,185,129;background:var(--bg);color:var(--ink);min-height:100vh;font-family:Nunito,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body.kur button,body.kur input,body.kur select{font:inherit}
.kh{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.kh-in{max-width:1180px;margin:0 auto;height:68px;padding:0 1.25rem;display:flex;align-items:center;gap:.9rem}
.kback{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink);text-decoration:none}
.kback:hover{background:var(--soft)}
.klogo{width:44px;height:44px;border-radius:12px;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(var(--p-rgb),.35);flex-shrink:0}
.kttl{min-width:0}.kttl h1{font-size:1.2rem;font-weight:800;line-height:1.15}.kttl p{font-size:.8rem;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kw{max-width:1180px;margin:0 auto;padding:1.25rem 1.25rem 3rem}
.grid{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:1.1rem;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:1.15rem 1.2rem}
.card+.card{margin-top:1.1rem}
.card h2{display:flex;align-items:center;gap:.5rem;font-size:.95rem;font-weight:800;margin-bottom:.9rem}
.card h2 .ic{width:30px;height:30px;border-radius:9px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.05rem}
.card h2 small{margin-left:auto;font-size:.74rem;color:var(--muted);font-weight:700}
label.f{display:block;font-size:.74rem;font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:.95rem 0 .4rem}
label.f:first-of-type{margin-top:0}
label.f span{text-transform:none;letter-spacing:0;font-weight:600}
select,input[type=number]{width:100%;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:.62rem .75rem;font-size:.9rem;font-weight:700}
select:focus,input:focus{outline:2px solid var(--p);outline-offset:1px}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:transparent;color:var(--muted);font-weight:800;font-size:.84rem;padding:.5rem .4rem;border-radius:9px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:.35rem}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.12)}
.seg.br button.on{background:var(--p);color:#fff;box-shadow:0 4px 12px rgba(var(--p-rgb),.3)}
.pos{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.pos button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:.45rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.35rem;font-weight:800;font-size:.76rem;color:var(--muted)}
.pos button i{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:6px;background:#EEF2F7}
.pos button i::after{content:"";position:absolute;height:22%;width:48%;border-radius:3px;background:#CBD5E1}
.pos button[data-v="alt-sol"] i::after{left:8%;bottom:10%}
.pos button[data-v="alt-orta"] i::after{left:26%;bottom:10%}
.pos button[data-v="ust-sol"] i::after{left:8%;top:10%}
.pos button.on{border-color:var(--p);color:var(--ink);box-shadow:0 0 0 3px rgba(var(--p-rgb),.15)}
.pos button.on i::after{background:var(--p)}
.row{display:flex;gap:.7rem}.row>*{flex:1;min-width:0}
.num{display:flex;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.num input{border:none;background:transparent;text-align:center;padding:.6rem 0;border-radius:0;-moz-appearance:textfield}
.num input::-webkit-outer-spin-button,.num input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num button{border:none;background:transparent;width:38px;align-self:stretch;font-size:1.15rem;font-weight:800;color:var(--muted);cursor:pointer}
.num button:hover{background:#EEF2F7;color:var(--ink)}
.ctools{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.6rem}
.ctools button{display:inline-flex;align-items:center;gap:.3rem;border:1px solid var(--line);background:#fff;color:#334155;border-radius:10px;padding:.4rem .7rem;font-size:.78rem;font-weight:800;cursor:pointer}
.ctools button:hover{background:var(--soft)}
.ctools .fin{background:#FFFBEB;border-color:#FDE68A;color:#92400E}
.ctools .cnt{margin-left:auto;align-self:center;font-size:.76rem;color:var(--muted);font-weight:700}
.cats{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:.7rem;padding-right:2px}
.cgh{font-size:.76rem;font-weight:900;color:#334155;margin-bottom:.35rem}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.35rem}
.cats label{position:relative;display:flex;align-items:center;gap:.35rem;font-size:.8rem;font-weight:700;color:#334155;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:.4rem .55rem;cursor:pointer;user-select:none;min-width:0}
.cats label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cats label input{position:absolute;opacity:0;pointer-events:none}
.cats label::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid #CBD5E1;flex-shrink:0;box-sizing:border-box}
.cats label:has(input:checked){border-color:var(--p);background:rgba(var(--p-rgb),.08);color:var(--ink)}
.cats label:has(input:checked)::before{border-color:var(--p);background:var(--p);box-shadow:inset 0 0 0 2px #fff}
.cg-fin{background:linear-gradient(180deg,#FFFBEB,#fff 75%);border:1px solid #FDE68A;border-radius:12px;padding:.6rem}
.url{width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.76rem;background:var(--soft);color:#334155;border:1px dashed #CBD5E1;border-radius:12px;padding:.75rem .8rem;word-break:break-all;line-height:1.5}
.url.bos{color:var(--muted);font-family:inherit;font-weight:700;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:none;border-radius:12px;padding:.68rem 1rem;font-weight:800;font-size:.86rem;cursor:pointer;color:#fff;background:var(--p);box-shadow:0 4px 12px rgba(var(--p-rgb),.28)}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.btn.g{background:#fff;border:1px solid var(--line);color:var(--ink);box-shadow:none}
.btn .material-icons-round{font-size:1.1rem}
.btns{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem;align-items:center}
.prev{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:repeating-conic-gradient(#E2E8F0 0 25%,#F1F5F9 0 50%) 50%/28px 28px}
.prev iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-top:.9rem}
.steps div{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:.6rem .7rem;font-size:.76rem;font-weight:600;color:#475569;line-height:1.45}
.steps b{display:block;color:var(--ink);font-size:.8rem;margin-bottom:.15rem}
.steps code{font-family:ui-monospace,monospace;color:var(--p);font-weight:700}
@media(max-width:600px){.steps{grid-template-columns:1fr}.kttl p{display:none}}
.note{font-size:.78rem;color:var(--muted);font-weight:600;line-height:1.55;margin-top:.7rem}
.ok{color:#16A34A;font-weight:800;font-size:.8rem}
</style>

<body>
<div id="app"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={apiKey:"AIzaSyDRcNy7IwpKhpYgRlaoo5BD8FL4myhklYY",authDomain:"analig.firebaseapp.com",databaseURL:"https://analig-default-rtdb.firebaseio.com",projectId:"analig",storageBucket:"analig.firebasestorage.app",messagingSenderId:"724523220392",appId:"1:724523220392:web:5141cbdb98d5c85f9cb19d"};
const Q=new URLSearchParams(location.search);
const BRANS={aerobik:"aerobik_yarismalar",ritmik:"ritmik_yarismalar",artistik:"competitions"};
const ALET={cember:"Çember",top:"Top",labut:"Labut",kurdele:"Kurdele",ip:"İp",serbest:"Serbest",grup_seri1:"1. Seri",grup_seri2:"2. Seri"};
const EN=Q.get("dil")==="en";
const L=EN?{puan:"SCORE",sira:r=>"RANK "+r,ksn:"Ded."}:{puan:"PUAN",sira:r=>r+". SIRA",ksn:"Kesinti"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const UP=s=>String(s??"").toLocaleUpperCase(EN?"en":"tr-TR");
const f3=v=>{const n=Number(v);return isFinite(n)?n.toFixed(3):"—"};

const comp=Q.get("comp");
const demo=Q.get("demo")==="1";
if(comp||demo)overlay();else location.replace("/"+(BRANS[Q.get("brans")]&&Q.get("brans")!=="artistik"?Q.get("brans"):"aerobik")+"/yayin-overlay"); // kurulum ekranı uygulamaya taşındı

/* =========================== OVERLAY =========================== */
function overlay(){
 document.body.className="ov";
 const brans=BRANS[Q.get("brans")]?Q.get("brans"):"aerobik",base=BRANS[brans];
 const pos=["alt-sol","alt-orta","ust-sol"].includes(Q.get("konum"))?Q.get("konum"):"alt-sol";
 const sure=Math.max(3,parseInt(Q.get("sure"))||12)*1000;          // puan kartı süresi
 const isimSure=Math.max(0,parseInt(Q.get("isimsure"))||0)*1000;    // 0 = sporcu değişene kadar kalır
 const taze=Math.max(0,parseInt(Q.get("taze"))||15)*60000;          // açılışta gösterilecek en eski çağrı
 const isimAcik=Q.get("isim")!=="0",puanAcik=Q.get("puan")!=="0";
 const katF=(Q.get("kat")||"").split(",").map(s=>s.trim()).filter(Boolean);
 const olcek=Math.min(200,Math.max(40,parseInt(Q.get("olcek"))||100))/100;

 document.getElementById("app").innerHTML=`<div class="stage pos-${pos}" style="--s:calc(100vw/1920*${olcek})"><div class="lt" id="lt">
  <div class="logo"><img src="/logo.png" alt=""><img class="gx" src="/brand/gymnaxis-logo.svg" alt="Gymexa Score"></div>
  <div class="body"><div class="cat" id="cat"></div><div class="name" id="nm"></div><div class="club" id="cl"></div><div class="chips" id="ch"></div></div>
  <div class="score"><div class="slbl">${L.puan}</div><div class="stot" id="tot"></div><div class="rank" id="rk"></div></div></div></div>`;
 const $=id=>document.getElementById(id),lt=$("lt");
 const DBG=Q.get("debug")==="1",log=(...a)=>DBG&&console.log("[overlay]",new Date().toISOString().slice(11,23),...a);

 let kats={},current=null,shownKey=null,scoreUntil=0,scoreTimer=null,nameTimer=null,lastFlash=null;
 const loadT=Date.now();
 const katAd=k=>{if(!k)return"";const c=kats[k];if(c&&(c.name||c.ad))return String(c.name||c.ad).replace(/^🏆\s*/,"");
  const [b0,al]=String(k).split("__");const cb=kats[b0];const bn=cb?(cb.name||cb.ad||b0):b0;return al?bn+" — "+(ALET[al]||al):bn};
 const katUygun=k=>!katF.length||katF.some(f=>k===f||String(k).startsWith(f+"__")||String(k).startsWith(f+"/"));

 const fitName=t=>{const n=$("nm");n.className="name"+(t.length>46?" cokuzun":t.length>28?" uzun":"")};
 const goster=()=>{lt.classList.remove("on");void lt.offsetWidth;requestAnimationFrame(()=>lt.classList.add("on"))};
 const gizle=()=>lt.classList.remove("on");

 // ---- ülke (uluslararası yarışma): bayrak + IOC kodu ----
 let GXI=null;try{import("/assets/intl-Ul01a2b3Cb2.js").then(m=>{GXI=m}).catch(()=>{})}catch(e){}
 const ulkeBas=(el,k)=>{if(!k)return;const u=GXI&&GXI.bayrakUrl(k);if(!u)return;const im=document.createElement("img");im.src=u;im.alt="";im.setAttribute("style","height:1em;width:1.333em;object-fit:cover;border-radius:2px;vertical-align:-0.12em;margin-right:.4em;box-shadow:0 0 0 1px rgba(0,0,0,.15)");el.insertBefore(im,el.firstChild)};
 // ---- sporcu adı ----
 const isimGoster=a=>{
  log("isim",a&&a.ad,a&&a.soyad,"scoreUntil-now",scoreUntil-Date.now());
  if(!isimAcik||!a)return;
  lt.classList.remove("puanli");
  const ad=[a.ad,a.soyad].filter(Boolean).join(" ");
  $("cat").textContent=UP(katAd(a._kat));$("nm").textContent=UP(ad);fitName(ad);
  $("cl").textContent=a.ulke?[a.ulke,(a.okul||a.kulup)&&(a.okul||a.kulup)!==a.ulke?UP(a.okul||a.kulup):""].filter(Boolean).join("  •  "):UP([a.okul||a.kulup,a.il].filter(Boolean).join("  •  "));ulkeBas($("cl"),a.ulke);$("ch").innerHTML="";
  goster();
  clearTimeout(nameTimer);if(isimSure)nameTimer=setTimeout(gizle,isimSure);
 };
 // ---- yayınlanan puan ----
 const puanGoster=t=>{
  log("puan",t.adSoyad,t.total);
  if(!puanAcik)return;
  clearTimeout(nameTimer);lt.classList.add("puanli");
  $("cat").textContent=UP(t.aletAd||katAd(t.kategori)||"");
  const ad=t.adSoyad||"";$("nm").textContent=UP(ad);fitName(ad);$("cl").textContent=t.ulke?[t.ulke,t.kulup&&t.kulup!==t.ulke?UP(t.kulup):""].filter(Boolean).join("  •  "):UP(t.kulup||"");ulkeBas($("cl"),t.ulke);
  const c=[];
  if(t.isRitmik){[["DA",t.da],["DB",t.db],["A",t.a],["E",t.e]].forEach(([k,v])=>v!=null&&c.push(`<span class="chip"><b>${k}</b>${f3(v)}</span>`));if(+t.pen>0)c.push(`<span class="chip ded"><b>${L.ksn}</b>-${f3(t.pen)}</span>`)}
  else{[["E",t.e],["A",t.a],["D",t.d]].forEach(([k,v])=>v!=null&&c.push(`<span class="chip"><b>${k}</b>${f3(v)}</span>`));const ded=+(t.p??t.pen??0);if(ded>0)c.push(`<span class="chip ded"><b>${L.ksn}</b>-${f3(ded)}</span>`)}
  $("ch").innerHTML=c.join("");$("tot").textContent=f3(t.total);
  const r=parseInt(t.sira);$("rk").style.display=r>0?"":"none";$("rk").textContent=r>0?L.sira(r):"";
  goster();
  scoreUntil=Date.now()+sure;clearTimeout(scoreTimer);
  scoreTimer=setTimeout(()=>{scoreUntil=0;
   // puandan sonra yeni bir sporcu çağrıldıysa onu göster, değilse kapat
   if(current&&current._key!==shownKey){shownKey=current._key;isimGoster(current)}else gizle()},sure);
 };

 if(demo){demoCalistir(isimGoster,puanGoster);return}

 const db=getDatabase(initializeApp(firebaseConfig));
 onValue(ref(db,`${base}/${comp}/kategoriler`),s=>{kats=s.val()||{}});

 // aktifSporcu: düz (aerobik/ritmik) veya alet bazında iç içe (artistik). En yeni çağrı gösterilir.
 const imza={},gorulme={};let ilk=!0;
 onValue(ref(db,`${base}/${comp}/aktifSporcu`),s=>{
  const v=s.val()||{},yap=[];
  const gez=(o,yol)=>{if(!o||typeof o!=="object")return;if(o.ad!=null||o.soyad!=null){yap.push({...o,_kat:yol[0],_yol:yol.join("/"),_key:yol.join("/")+"|"+(o.id||"")+"|"+(o.ts||"")});return}Object.keys(o).forEach(k=>gez(o[k],[...yol,k]))};
  Object.keys(v).forEach(k=>gez(v[k],[k]));
  const now=Date.now();
  yap.forEach(a=>{const sg=a._key,p=a._yol;if(imza[p]!==sg){gorulme[p]=ilk?0:now;imza[p]=sg}a._t=a.ts||gorulme[p]||0});
  const aday=yap.filter(a=>katUygun(a._kat)).sort((x,y)=>y._t-x._t)[0]||null;
  log("aktifSporcu",aday&&aday.ad,"key",aday&&aday._key,"shown",shownKey,"ilk",ilk);
  const wasIlk=ilk;ilk=!1;
  if(!aday)return;
  if(wasIlk&&!(aday.ts&&now-aday.ts<taze)){current=aday;shownKey=aday._key;return} // eski çağrı: açılışta gösterme
  current=aday;
  if(aday._key===shownKey)return;
  if(Date.now()<scoreUntil)return;  // puan kartı bitince gösterilecek
  shownKey=aday._key;isimGoster(aday);
 });

 // flashTrigger: Üst Jüri / başhakem puanı yayınladığında
 onValue(ref(db,`${base}/${comp}/flashTrigger`),s=>{
  const t=s.val();if(!t||!t.timestamp)return;
  if(t.timestamp===lastFlash)return;lastFlash=t.timestamp;
  if(t.timestamp<loadT-5000)return; // sayfa açılmadan önceki puan
  if(katF.length){const ok=katF.some(f=>t.kategori===f||String(t.kategori||"").startsWith(f+"__")||UP(katAd(f))===UP(t.aletAd));if(!ok)return}
  puanGoster(t);
 });
}

 const $=id=>document.getElementById(id);

 // seçmeli (segment) kontroller: değer .value'da tutulur
 const segKur=(id,ilk,cb)=>{const el=$(id);const sec=v=>{el.value=v;el.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===v))};sec(ilk);el.querySelectorAll("button").forEach(b=>b.onclick=()=>{sec(b.dataset.v);cb&&cb()});};
 document.querySelectorAll(".num").forEach(n=>{const inp=n.querySelector("input");n.querySelectorAll("button").forEach(b=>b.onclick=()=>{const v=Math.min(+inp.max,Math.max(+inp.min,(+inp.value||0)+(+b.dataset.d)));inp.value=v;uret()})});
 const tema=()=>{const b=$("br").value,[c,rgb,ic]=RENK[b];document.body.style.setProperty("--p",c);document.body.style.setProperty("--p-rgb",rgb);$("lg").innerHTML=MI(ic);$("bk").href="/"+b};

 $("cAll").onclick=()=>toplu(()=>!0);$("cClr").onclick=()=>toplu(()=>!1);$("cFin").onclick=()=>toplu(isFin);
