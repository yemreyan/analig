const elle=()=>{const k=P.kontrol;if(!k||!k.g||k.g==="gizle")return null;if(+k.sure>0&&Date.now()>(+k.ts||0)+k.sure*1000)return null;return k};

 const det=o.detay?(brans==="ritmik"?[s.da,s.db,s.a,s.e]:brans==="artistik"?[s.d,s.e]:[s.d,s.a,s.e]).map(v=>`<span class="dt">${s.yalnizIrm?"":f3(v)}</span>`).join("")+`<span class="dt">${s.pen?"-"+f3(s.pen):""}</span>`:"";
 return `<div class="rw${o.me?" me":""}">${rk}<span class="nm"><div class="n1">${ul?fl(u):""}${esc(UP(adK(g),u))}${!g.takim&&ul?` <span style="opacity:.7">${esc(u)}</span>`:""}</div><div class="n2">${esc(UP(altK(g),u))}</div></span>${det}<span class="sc">${s.yalnizIrm?`<span class="irm">${esc(s.irm)}</span>`:f3(s.total)}</span></div>`};

 const al=tabloAlet(k),S=V.siralama({brans,kats:D.kats,kat:k,spor:D.spor[k],puan:D.puan[k],alet:al}),n=Math.max(3,Math.min(20,+C.tablo.n||8));

 const R=V.siradakiler({brans,kats:D.kats,kat:k,spor:D.spor[k],puan:D.puan[k],alet:al,cagrilan:ak,n:Math.max(1,Math.min(8,+C.sirada.n||3))});

 const wasIlk=ilk;ilk=!1;katGuncelle();cizSirada();tick();
 if(!aday)return;
 if(wasIlk&&!(aday.ts&&now-aday.ts<taze)){current=aday;shownKey=aday._key;return} // eski çağrı: açılışta gösterme
