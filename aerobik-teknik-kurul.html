<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teknik Kurul — Sıralama & Detay — TCF</title>
<link rel="icon" type="image/png" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0e1a;--panel:#131a2b;--panel2:#1b2438;--line:#2a3550;--txt:#e8edf7;--muted:#8b97b3;--accent:#6366f1;--ok:#22c55e;--gold:#fbbf24;--team:#0891b2;--warn:#ef4444}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:rgba(10,14,26,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:.7rem 1rem;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.55rem;font-weight:800;font-size:1.05rem}
.brand .material-icons-round{color:var(--gold)}
.wrap{max-width:1100px;margin:0 auto;padding:1rem}
select,input.search{font:inherit;font-weight:700;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:.55rem .7rem;font-size:.9rem}
select{min-width:200px}
input.search{min-width:180px}
.live{display:inline-flex;align-items:center;gap:.4rem;color:#86efac;font-weight:800;font-size:.8rem}
.live .dot{width:9px;height:9px;border-radius:50%;background:#22c55e;animation:bl 1.4s infinite}@keyframes bl{50%{opacity:.3}}
.notice{text-align:center;color:var(--muted);padding:3rem 1rem;font-weight:600}
.count{color:var(--muted);font-weight:700;font-size:.85rem;margin:.4rem 0 1rem}
.rank-sec{margin:0 0 1.6rem}
.rank-head{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.15rem;margin-bottom:.7rem;padding-bottom:.45rem;border-bottom:2px solid rgba(99,102,241,.35)}
.rank-head .material-icons-round{color:var(--accent)}
.rank-head .cnt{color:var(--muted);font-weight:700;font-size:.85rem}
.rank-list{display:flex;flex-direction:column;gap:.5rem}
.rank-row{display:flex;align-items:center;gap:.9rem;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.7rem 1rem;cursor:pointer;transition:.12s}
.rank-row:hover{border-color:var(--accent);transform:translateX(3px)}
.rank-no{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.15rem;background:var(--panel2);flex-shrink:0}
.rank-row.r1 .rank-no{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1200}
.rank-row.r2 .rank-no{background:linear-gradient(135deg,#e2e8f0,#94a3b8);color:#111}
.rank-row.r3 .rank-no{background:linear-gradient(135deg,#f59e0b,#b45309);color:#fff}
.rank-ath{flex:1;min-width:0}
.rank-ath .n{font-weight:800;font-size:1.05rem;line-height:1.15;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.rank-ath .c{color:var(--muted);font-size:.8rem;font-weight:700;margin-top:.1rem}
.rank-mini{display:flex;gap:.7rem;font-size:.72rem;color:var(--muted);font-weight:700;flex-wrap:wrap;margin-top:.25rem}
.rank-mini b{color:var(--txt)}
.rank-fin{font-size:1.55rem;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;flex-shrink:0}
.rank-badge{font-size:.6rem;font-weight:800;padding:.15rem .45rem;border-radius:5px;text-transform:uppercase;letter-spacing:.03em}
.rank-badge.ok{background:rgba(34,197,94,.15);color:#86efac}
.rank-badge.wait{background:rgba(251,191,36,.15);color:#fbbf24}
.tap-hint{color:var(--muted);font-size:16px;flex-shrink:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.9rem;margin-top:.4rem}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:1rem;cursor:pointer;transition:.15s;position:relative}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .lbl{font-size:.75rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:.4rem}
.card .lbl .b{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;color:#fff}
.card .val{font-size:1.8rem;font-weight:800;margin-top:.4rem}
.card .tap{position:absolute;top:.6rem;right:.6rem;color:var(--muted);font-size:15px}
.bD .b{background:#8b5cf6}.bA .b{background:#f59e0b}.bE .b{background:#0891b2}.bP .b{background:#ef4444}.bL .b{background:#10b981}.bT .b{background:#3b82f6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:60;padding:1rem}
.modal.hidden{display:none}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1.3rem;width:100%;max-width:600px;max-height:90vh;overflow:auto}
.mcard h3{font-size:1.2rem;font-weight:800;margin-bottom:.2rem;display:flex;align-items:center;gap:.5rem}
.mcard .msub{color:var(--muted);font-size:.85rem;font-weight:700;margin-bottom:1rem}
.jrow{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem;margin-bottom:.6rem}
.jrow .jh{display:flex;justify-content:space-between;font-weight:800;margin-bottom:.4rem}
.jrow .jh .jv{color:var(--gold)}
.kv{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.3rem}
.kv span{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.15rem .5rem;font-size:.75rem;font-weight:700}
.kv span.ded{color:#fca5a5;border-color:#5b2b2b}
.mbtns{display:flex;gap:.5rem;margin-top:.6rem}
.mbtn{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:.7rem;font:inherit;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><span class="material-icons-round">emoji_events</span> Teknik Kurul — Sıralama</div>
  <select id="compSel"><option value="">Yarışma seçin…</option></select>
  <select id="catSel"><option value="">— Tüm kategoriler —</option></select>
  <input class="search" id="search" placeholder="Sporcu / kulüp ara…">
  <span class="live" id="live" style="display:none"><span class="dot"></span>CANLI</span>
</div>
<div class="wrap">
  <div id="body"><div class="notice">Yarışma seçin. Yarışması biten sporcular kategori bazında sıralı olarak burada görünecek.</div></div>
</div>
<div id="modal" class="modal hidden"><div class="mcard" id="mcard"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyDRcNy7IwpKhpYgRlaoo5BD8FL4myhklYY",authDomain:"analig.firebaseapp.com",databaseURL:"https://analig-default-rtdb.firebaseio.com",projectId:"analig",storageBucket:"analig.firebasestorage.app",messagingSenderId:"724523220392",appId:"1:724523220392:web:5141cbdb98d5c85f9cb19d"};
const db=getDatabase(initializeApp(firebaseConfig));
const BASE="aerobik_yarismalar";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[<&>]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
const f2=v=>v==null||isNaN(v)?"—":Number(v).toFixed(2);
const f3=v=>v==null||isNaN(v)?"—":Number(v).toFixed(3);
let comps={}, comp="", spor={}, punanlar={}, unsubP=null, catF="", q="", items=[];

const CRIT={artisticRoutine:"Artistik Rutin",content2:"İçerik 2",generalContent:"Genel İçerik",music:"Müzik",performance:"Performans"};
const nice=k=>CRIT[k]||k.replace(/([A-Z])/g," $1").replace(/^./,c=>c.toUpperCase());
function trimA(o){if(!o)return null;const v=["j1","j2","j3","j4"].map(k=>o[k]).filter(x=>x!=null&&!isNaN(x));if(v.length<2)return v[0]??null;if(v.length===4){v.sort((x,y)=>x-y);return (v[1]+v[2])/2;}return v.reduce((a,b)=>a+b,0)/v.length;}
function calcE(o){if(!o)return null;const v=["j1","j2","j3","j4"].map(k=>o[k]).filter(x=>x!=null&&!isNaN(x));if(!v.length)return null;let m;if(v.length===4){const s=[...v].sort((x,y)=>x-y);m=(s[1]+s[2])/2;}else m=v.reduce((a,b)=>a+b,0)/v.length;return 10-m;}
function comps6(sc){
  const d=sc.dScore!=null?sc.dScore:null;
  const a=sc.aScore!=null?sc.aScore:trimA(sc.aPanel);
  const e=sc.eScore!=null?sc.eScore:calcE(sc.ePanel);
  const p=sc.penalty!=null?sc.penalty:(sc.totalPenalties!=null?sc.totalPenalties:(sc.neutralDeductions!=null?sc.neutralDeductions:0));
  const l=sc.lPanel!=null?(typeof sc.lPanel==="object"?(sc.lPanel.totalDeduction??sc.lPanel.deduction):sc.lPanel):null;
  const t=sc.tPanel!=null?(typeof sc.tPanel==="object"?sc.tPanel.deduction:sc.tPanel):null;
  const fin=sc.finalScore!=null?sc.finalScore:(sc.sonuc!=null?sc.sonuc:((d||0)+(a||0)+(e||0)-(p||0)));
  return {d,a,e,p,l,t,fin};
}
function isFinished(sc){return sc&&typeof sc==="object"&&(sc.kilitli===true||sc.durum==="tamamlandi"||sc.durum==="ustJuriBekliyor"||sc.sonuc!=null||sc.finalScore!=null);}

onValue(ref(db,BASE),s=>{
  comps=s.val()||{};
  const opts=Object.entries(comps).filter(([id,c])=>c&&typeof c==="object").sort((a,b)=>(b[1].baslangicTarihi||"").localeCompare(a[1].baslangicTarihi||""));
  $("compSel").innerHTML='<option value="">Yarışma seçin…</option>'+opts.map(([id,c])=>`<option value="${id}">${esc(c.isim||c.ad||id)}</option>`).join("");
  if(comp&&comps[comp])$("compSel").value=comp;
  else if(!comp&&opts.length===1){comp=opts[0][0];$("compSel").value=comp;watch();}
  if(comp&&comps[comp]&&items.length)render();
});
$("compSel").addEventListener("change",e=>{comp=e.target.value;watch();});
$("catSel").addEventListener("change",e=>{catF=e.target.value;render();});
$("search").addEventListener("input",e=>{q=e.target.value;render();});

function watch(){
  unsubP&&unsubP();unsubP=null;
  if(!comp){$("body").innerHTML='<div class="notice">Yarışma seçin.</div>';$("live").style.display="none";return;}
  $("live").style.display="";
  onValue(ref(db,`${BASE}/${comp}/sporcular`),s=>{spor=s.val()||{};build();});
  unsubP=onValue(ref(db,`${BASE}/${comp}/puanlar`),s=>{punanlar=s.val()||{};build();});
}

function build(){
  const cats=comps[comp]?.kategoriler||{};
  items=[];
  Object.entries(punanlar).forEach(([cat,aths])=>{
    if(!aths||typeof aths!=="object")return;
    const catName=cats[cat]?.name||cat;
    Object.entries(aths).forEach(([ath,sc])=>{
      if(!isFinished(sc))return;
      const info=(spor[cat]&&spor[cat][ath])||{};
      const name=[info.ad,info.soyad].filter(Boolean).join(" ")||ath;
      const club=info.il||info.okul||info.kulup||"";
      const C=comps6(sc);
      const done=sc.kilitli===true||sc.durum==="tamamlandi";
      items.push({cat,catName,ath,name,club,il:info.il||"",ad:info.ad||name,soyad:info.soyad||"",okul:info.okul||info.kulup||"",score:sc,C,fin:C.fin,done});
    });
  });
  // kategori filtresi secenekleri
  const catMap=[...new Map(items.map(i=>[i.cat,comps[comp]?.kategoriler?.[i.cat]?.name||i.catName])).entries()].sort((a,b)=>String(a[1]).localeCompare(String(b[1]),"tr-TR"));
  const prev=catF;
  $("catSel").innerHTML='<option value="">— Tüm kategoriler —</option>'+catMap.map(([cv,cn])=>`<option value="${cv}">${esc(cn)}</option>`).join("");
  if(prev&&catMap.some(([cv])=>cv===prev))$("catSel").value=prev;else catF="";
  render();
}

function render(){
  if(!comp){return;}
  let list=items.slice();
  if(catF)list=list.filter(i=>i.cat===catF);
  if(q.trim()){const s=q.toLocaleLowerCase("tr-TR");list=list.filter(i=>i.name.toLocaleLowerCase("tr-TR").includes(s)||(i.club||"").toLocaleLowerCase("tr-TR").includes(s));}
  if(!list.length){$("body").innerHTML='<div class="notice">'+(items.length?"Sonuç bulunamadı.":"Henüz yarışması biten sporcu yok. Puanlar kaydedildikçe sıralama burada oluşacak.")+'</div>';return;}
  // kategoriye gore grupla, her kategoride finale gore sirala
  const groups=[];
  list.forEach(it=>{let g=groups.find(x=>x.cat===it.cat);if(!g){g={cat:it.cat,catName:it.catName,rows:[]};groups.push(g);}g.rows.push(it);});
  groups.sort((a,b)=>String(a.catName).localeCompare(String(b.catName),"tr-TR"));
  groups.forEach(g=>g.rows.sort((a,b)=>(b.fin||0)-(a.fin||0)));
  const total=list.length;
  let html='<div class="count">'+total+' sporcu · '+groups.length+' kategori (yarışması bitenler, sıralı)</div>';
  html+=groups.map(g=>`
    <div class="rank-sec">
      <div class="rank-head"><span class="material-icons-round">folder</span>${esc(comps[comp]?.kategoriler?.[g.cat]?.name||g.catName)}<span class="cnt">(${g.rows.length})</span></div>
      <div class="rank-list">${g.rows.map((it,i)=>{
        const rank=i+1;
        return `<div class="rank-row ${rank<=3?"r"+rank:""}" data-cat="${esc(it.cat)}" data-ath="${esc(it.ath)}">
          <div class="rank-no">${rank}</div>
          <div class="rank-ath">
            <div class="n">${esc(it.name)} <span class="rank-badge ${it.done?"ok":"wait"}">${it.done?"onaylı":"bekliyor"}</span></div>
            ${it.club?`<div class="c">${esc(it.club)}</div>`:""}
            <div class="rank-mini"><span>D <b>${f2(it.C.d)}</b></span><span>A <b>${f2(it.C.a)}</b></span><span>E <b>${f2(it.C.e)}</b></span>${it.C.p?`<span>P <b>−${f2(it.C.p)}</b></span>`:""}${it.C.l!=null?`<span>L <b>−${f2(it.C.l)}</b></span>`:""}${it.C.t!=null?`<span>T <b>−${f2(it.C.t)}</b></span>`:""}</div>
          </div>
          <div class="rank-fin">${f3(it.fin)}</div>
          <span class="material-icons-round tap-hint">chevron_right</span>
        </div>`;
      }).join("")}</div>
    </div>`).join("");
  $("body").innerHTML=html;
  $("body").querySelectorAll(".rank-row").forEach(el=>el.onclick=()=>{const it=items.find(x=>x.cat===el.dataset.cat&&x.ath===el.dataset.ath);it&&showAthlete(it);});
}

function showAthlete(it){
  const sc=it.score,C=it.C,a={ad:it.ad,soyad:it.soyad,il:it.il,okul:it.okul};
  const cards=[
    {k:"D",cls:"bD",v:f3(C.d),dt:"d"},{k:"A",cls:"bA",v:f3(C.a),dt:"a"},{k:"E",cls:"bE",v:f3(C.e),dt:"e"},
    {k:"P",cls:"bP",v:C.p?("−"+f2(C.p)):"0.00",dt:"p"},{k:"L",cls:"bL",v:C.l!=null?("−"+f2(C.l)):"—",dt:"l"},{k:"T",cls:"bT",v:C.t!=null?("−"+f2(C.t)):"—",dt:"t"},
  ];
  $("mcard").innerHTML=`<h3>${esc(it.name)}</h3><div class="msub">${esc(comps[comp]?.kategoriler?.[it.cat]?.name||it.catName)}${it.club?" · "+esc(it.club):""} · Toplam <strong style="color:var(--gold)">${f3(C.fin)}</strong></div>
    <div class="grid">${cards.map(c=>`<div class="card ${c.cls}" data-dt="${c.dt}"><span class="material-icons-round tap">touch_app</span><div class="lbl"><span class="b">${c.k}</span></div><div class="val">${c.v}</div></div>`).join("")}</div>
    <div class="mbtns"><button class="mbtn" id="mclose">Kapat</button></div>`;
  $("modal").classList.remove("hidden");
  $("mcard").querySelectorAll(".card").forEach(el=>el.onclick=()=>detail(el.dataset.dt,sc,a,()=>showAthlete(it)));
  $("mclose").onclick=()=>$("modal").classList.add("hidden");
}

function detail(dt,sc,a,back){
  let title="",sub="",html="";
  if(dt==="a"){
    const bd=sc.aPanelBreakdown||{}, ap=sc.aPanel||{};
    html=["j1","j2","j3","j4"].map(j=>{const b=bd[j]||{},note=ap[j]??b.finalAScore;
      const crit=b.criteriaValues?Object.entries(b.criteriaValues).map(([k,v])=>`<span>${esc(nice(k))}: ${f2(v)}</span>`).join(""):"";
      const ded=b.deductionValues?Object.entries(b.deductionValues).map(([k,v])=>`<span class="ded">${esc(nice(k))}: −${v}</span>`).join(""):"";
      return `<div class="jrow"><div class="jh"><span>A${j.replace("j","")} Hakemi</span><span class="jv">${note!=null?f2(note):"—"}</span></div>${crit?`<div class="kv">${crit}</div>`:""}${ded?`<div class="kv" style="margin-top:.35rem">${ded}</div>`:""}</div>`;
    }).join("");
    title="A — Artistik Detay";sub=`Ortalama (trimmed): ${f3(comps6(sc).a)}`;
  } else if(dt==="e"){
    const ep=sc.ePanel||{};
    html=["j1","j2","j3","j4"].map(j=>`<div class="jrow"><div class="jh"><span>E${j.replace("j","")} Hakemi</span><span class="jv">kesinti −${ep[j]!=null?f2(ep[j]):"—"}</span></div></div>`).join("");
    title="E — İcra Detay";sub=`İcra puanı (10 − trimmed kesinti): ${f3(comps6(sc).e)}`;
  } else if(dt==="d"){
    const dp=sc.dPanel||{}, sl=dp.slots||{};
    const slots=Object.entries(sl).map(([k,v])=>`<span>${k.toUpperCase()}: ${f2(v)}</span>`).join("")||"<span>—</span>";
    html=`<div class="jrow"><div class="jh"><span>Element Slotları</span><span class="jv">ham ${f2(dp.rawTotal)}</span></div><div class="kv">${slots}</div>${dp.deduction?`<div class="kv" style="margin-top:.35rem"><span class="ded">D kesinti: −${dp.deduction}</span></div>`:""}</div><div class="jrow"><div class="jh"><span>Bölen (dDivisor)</span><span class="jv">${sc.dDivisor??"—"}</span></div></div>`;
    title="D — Zorluk Detay";sub=`D puanı: ${f3(comps6(sc).d)}`;
  } else if(dt==="p"){
    const nd=sc.penalties||sc.deductionDetail||sc.penaltyDetail||null;
    if(nd&&typeof nd==="object") html=`<div class="jrow"><div class="kv">${Object.entries(nd).filter(([k,v])=>v).map(([k,v])=>`<span class="ded">${esc(nice(k))}: −${v}</span>`).join("")||"<span>—</span>"}</div></div>`;
    else html=`<div class="jrow"><div class="jh"><span>Toplam ceza/kesinti</span><span class="jv">−${f2(comps6(sc).p)}</span></div></div>`;
    title="P — Ceza / Nötr Kesinti";sub=`Toplam: −${f2(comps6(sc).p)}`;
  } else if(dt==="l"){
    const lp=sc.lPanel; const v=typeof lp==="object"?(lp.totalDeduction??lp.deduction):lp; const calls=typeof lp==="object"?lp.calls:null;
    title="L — Çizgi Detay";sub="Çizgi kesintisi";html=`<div class="jrow"><div class="jh"><span>Çizgi Hakemi</span><span class="jv">−${v!=null?f2(v):"—"}</span></div>${calls!=null?`<div class="kv"><span>${calls} çizgi ihlali</span></div>`:""}</div>`;
  } else if(dt==="t"){
    const tp=sc.tPanel; const v=typeof tp==="object"?tp.deduction:tp; const dur=typeof tp==="object"?tp.routineDuration:null;
    title="T — Süre Detay";sub="Süre kesintisi";html=`<div class="jrow"><div class="jh"><span>Zaman Hakemi</span><span class="jv">${tp&&tp.dq?"DQ":"−"+(v!=null?f2(v):"—")}</span></div>${dur!=null?`<div class="kv"><span>Rutin süresi: ${dur}s</span></div>`:""}</div>`;
  }
  $("mcard").innerHTML=`<h3>${esc(title)}</h3><div class="msub">${esc(sub)}</div>${html}<div class="mbtns">${back?'<button class="mbtn" id="mback">◀ Geri</button>':""}<button class="mbtn" id="mclose">Kapat</button></div>`;
  $("modal").classList.remove("hidden");
  if(back)$("mback").onclick=back;
  $("mclose").onclick=()=>$("modal").classList.add("hidden");
}
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")$("modal").classList.add("hidden");});

const qc=new URLSearchParams(location.search).get("comp")||new URLSearchParams(location.search).get("compId");
if(qc){comp=qc;watch();}
</script>
</body>
</html>
