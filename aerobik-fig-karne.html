<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aerobik FIG Hakem Karnesi — TCF</title>
<link rel="icon" type="image/png" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0e1a;--panel:#131a2b;--panel2:#1b2438;--line:#2a3550;--txt:#e8edf7;--muted:#8b97b3;--accent:#6366f1;--ok:#22c55e;--warn:#ef4444;--gold:#fbbf24}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:rgba(10,14,26,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:.7rem 1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.55rem;font-weight:800}
.brand .material-icons-round{color:var(--gold)}
select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:.5rem .8rem;font:inherit;font-size:.85rem;font-weight:700;cursor:pointer;max-width:340px}
.wrap{max-width:1100px;margin:0 auto;padding:1rem}
.bar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:none;border-radius:10px;padding:.6rem 1rem;font:inherit;font-weight:800;font-size:.85rem;cursor:pointer;color:#fff;background:var(--accent)}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.5;cursor:default}
.btn--all{background:var(--gold);color:#3a2c00}
.count{color:var(--muted);font-weight:700;font-size:.85rem}
table{width:100%;border-collapse:collapse}
th,td{padding:.55rem .7rem;text-align:left;font-size:.84rem;border-bottom:1px solid rgba(40,52,79,.6)}
th{color:var(--muted);font-weight:800;font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;background:#0d1526;position:sticky;top:52px}
tbody tr:hover{background:rgba(255,255,255,.02)}
.num{text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.pill{display:inline-block;padding:.2rem .55rem;border-radius:999px;font-weight:800;font-size:.72rem}
.g-cok-iyi{background:rgba(34,197,94,.16);color:#86efac}.g-iyi{background:rgba(132,204,22,.16);color:#bef264}
.g-kabul{background:rgba(234,179,8,.16);color:#fde047}.g-sinirda{background:rgba(249,115,22,.16);color:#fdba74}.g-incelenmeli{background:rgba(239,68,68,.16);color:#fca5a5}
.tag{display:inline-block;padding:.15rem .5rem;border-radius:6px;font-weight:800;font-size:.7rem}
.tag-a{background:rgba(236,72,153,.16);color:#f9a8d4}.tag-e{background:rgba(16,185,129,.16);color:#6ee7b7}
.tag-sj{background:rgba(99,102,241,.16);color:#a5b4fc}.tag-avg{background:rgba(139,151,179,.16);color:#c7d0e0}
.rowbtn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:.35rem .7rem;font:inherit;font-weight:800;font-size:.78rem;cursor:pointer}
.rowbtn:hover{border-color:var(--accent)}
.notice{text-align:center;color:var(--muted);padding:3rem 1rem;font-weight:600}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:.7rem 1.1rem;border-radius:12px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.hint{color:var(--muted);font-size:.8rem;font-weight:600;margin-bottom:.6rem}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><span class="material-icons-round">fact_check</span> AEROBİK FIG HAKEM KARNESİ</div>
  <select id="compSel" style="margin-left:auto"><option value="">Yarışma yükleniyor…</option></select>
  <select id="catSel"><option value="">Tüm kategoriler</option></select>
  <select id="panelSel"><option value="">A + E panel</option><option value="a">Sadece A (Artistik)</option><option value="e">Sadece E (İcra)</option></select>
</div>
<div class="wrap">
  <div class="bar">
    <button id="allBtn" class="btn btn--all" disabled><span class="material-icons-round" style="font-size:1.1rem">picture_as_pdf</span> Tüm Karneler (tek PDF)</button>
    <span id="count" class="count"></span>
  </div>
  <div class="hint">Her satır = bir panel pozisyonu (A1–A4 / E1–E4) × kategori. <b>Referans (kontrol):</b> varsa Süper Jüri (SJA/SJE) notu; yoksa panel ortalaması (kesilmiş). Sapma = hakem notu − referans.</div>
  <div id="list"></div>
</div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = { apiKey:"AIzaSyDRcNy7IwpKhpYgRlaoo5BD8FL4myhklYY", authDomain:"analig.firebaseapp.com", databaseURL:"https://analig-default-rtdb.firebaseio.com", projectId:"analig", storageBucket:"analig.firebasestorage.app", messagingSenderId:"724523220392", appId:"1:724523220392:web:5141cbdb98d5c85f9cb19d" };
const db = getDatabase(initializeApp(firebaseConfig));
const BASE="aerobik_yarismalar";
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const PANEL_LABEL={a:"A — Artistik",e:"E — İcra"};
const tr = s => String(s==null?"":s).replace(/ı/g,"i").replace(/İ/g,"I").replace(/ş/g,"s").replace(/Ş/g,"S").replace(/ğ/g,"g").replace(/Ğ/g,"G").replace(/ü/g,"u").replace(/Ü/g,"U").replace(/ö/g,"o").replace(/Ö/g,"O").replace(/ç/g,"c").replace(/Ç/g,"C");
const esc = s => String(s==null?"":s).replace(/</g,"&lt;");
function toast(m){ const t=$("toast"); t.textContent=m; t.className="toast show"; setTimeout(()=>t.className="toast",2200); }
let comps={}, comp="", compData=null, logoData=null;
const reportDate=new Date().toLocaleString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
(async()=>{ try{ const r=await fetch("/logo.png"); if(r.ok){ const bl=await r.blob(); logoData=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(bl);}); } }catch(e){} })();
const NAVY=[28,37,64], TCFRED=[200,16,42], ORANGE=[210,120,20];
// --- Turkce PDF fontu (DejaVu Sans, gomulu) ---
let fontReg=null, fontBold=null, PDFFONT="helvetica";
const T=s=>PDFFONT==="helvetica"?tr(s):String(s==null?"":s);
async function fetchFontB64(u){ const r=await fetch(u); const buf=await r.arrayBuffer(); const by=new Uint8Array(buf); let bin=""; for(let i=0;i<by.length;i+=8192) bin+=String.fromCharCode.apply(null,by.subarray(i,i+8192)); return btoa(bin); }
(async()=>{ try{ const B="https://cdn.jsdelivr.net/npm/dejavu-fonts-ttf@2.37.3/ttf/"; [fontReg,fontBold]=await Promise.all([fetchFontB64(B+"DejaVuSans.ttf"),fetchFontB64(B+"DejaVuSans-Bold.ttf")]); }catch(e){} })();

// --- metrikler ---
function trimmedMean(ds){ ds=ds.filter(d=>d!=null&&!isNaN(d)).map(Number); if(ds.length>=4){ const s=[...ds].sort((a,b)=>a-b); return s.slice(1,-1).reduce((a,b)=>a+b,0)/(s.length-2); } return ds.length?ds.reduce((a,b)=>a+b,0)/ds.length:0; }
function isCounted(ds,my){ ds=ds.filter(d=>d!=null).map(Number); if(ds.length<4) return true; const s=[...ds].sort((a,b)=>a-b); return my!==s[0]&&my!==s[s.length-1]; }
function discPts(d){ d=Math.abs(d); return d<=.1?1:d<=.2?.85:d<=.3?.7:d<=.5?.45:d<=.7?.2:0; }
function discColor(d){ d=Math.abs(d); return d<=.1?[34,197,94]:d<=.2?[139,195,74]:d<=.3?[158,157,36]:d<=.5?[141,110,99]:d<=.7?[211,47,47]:[183,28,28]; }
function gradeShort(acc){ return acc>=.85?["Çok İyi","g-cok-iyi"]:acc>=.70?["İyi","g-iyi"]:acc>=.55?["Kabul","g-kabul"]:acc>=.40?["Sınırda","g-sinirda"]:["İncelenmeli","g-incelenmeli"]; }
function grade(acc){ return acc>=.85?["Very Good","g-cok-iyi"]:acc>=.70?["Good","g-iyi"]:acc>=.55?["Acceptable","g-kabul"]:acc>=.40?["Marginal","g-sinirda"]:["Review","g-incelenmeli"]; }

// takim/cift isim cozumu (anahtar = cat::okul::grupNo)
function resolveName(cat, aid){
  const spCat=compData.sporcular?.[cat]||{}; const i=spCat[aid];
  if(i) return {name:((i.ad||"")+" "+(i.soyad||"")).trim()||i.adSoyad||aid, okul:i.okul||i.kulup||"", il:i.il||""};
  const parts=String(aid).split("::"), gn=parts[parts.length-1], ok=parts.length>=3?parts.slice(1,-1).join("::"):"";
  const mem=Object.values(spCat).filter(m=>m&&String(m.grupNo??m.cikisSirasi??"")===String(gn)&&(ok===""||String(m.okul||m.kulup||"")===ok));
  const nm=mem.map(m=>((m.ad||"")+" "+(m.soyad||"")).trim()).filter(Boolean).join(", ");
  return {name:nm||aid, okul:mem[0]?.okul||mem[0]?.kulup||"", il:mem[0]?.il||""};
}

// pozisyon değerlendirmesi (kategori × panel × poz)
function evalPosition(cat, panel, pos){
  const aths=compData.puanlar?.[cat]||{};
  const jkey="j"+pos;
  const rows=[]; let sjCount=0, avgCount=0;
  Object.entries(aths).forEach(([aid,r])=>{
    if(!r||typeof r!=="object"||r.durum!=="tamamlandi") return;
    let mark, ctrl, refSrc, ds;
    if(panel==="a"){
      const ap=r.aPanel||{}; const v=ap[jkey]; if(v==null||isNaN(v)) return;
      mark=Number(v); ds=[ap.j1,ap.j2,ap.j3,ap.j4];
      const sj=r.sjPanel?.a?.value;
      if(sj!=null&&!isNaN(sj)){ ctrl=Number(sj); refSrc="SJA"; sjCount++; }
      else { ctrl=(r.aScore!=null&&!isNaN(r.aScore))?Number(r.aScore):trimmedMean(ds); refSrc="A ort."; avgCount++; }
    } else {
      const ep=r.ePanel||{}; const dd=ep[jkey]; if(dd==null||isNaN(dd)) return;
      mark=10-Number(dd); ds=[ep.j1,ep.j2,ep.j3,ep.j4].map(x=>x==null||isNaN(x)?null:10-Number(x));
      const sj=r.sjPanel?.e?.value;
      if(sj!=null&&!isNaN(sj)){ ctrl=10-Number(sj); refSrc="SJE"; sjCount++; }
      else { ctrl=(r.eScore!=null&&!isNaN(r.eScore))?Number(r.eScore):10-trimmedMean([ep.j1,ep.j2,ep.j3,ep.j4]); refSrc="E ort."; avgCount++; }
    }
    const disc=mark-ctrl;
    const nm=resolveName(cat,aid);
    rows.push({aid,name:nm.name,okul:nm.okul,il:nm.il,ctrl:+ctrl.toFixed(3),mark:+mark.toFixed(3),disc:+disc.toFixed(3),refSrc,counted:isCounted(ds,mark)});
  });
  rows.sort((a,b)=>b.ctrl-a.ctrl);
  const n=rows.length;
  const acc=n?rows.reduce((s,r)=>s+discPts(r.disc),0)/n:0;
  const avgAbs=n?rows.reduce((s,r)=>s+Math.abs(r.disc),0)/n:0;
  const avgSigned=n?rows.reduce((s,r)=>s+r.disc,0)/n:0;
  return {cat,panel,pos,label:panel.toUpperCase()+pos,rows,n,acc,avgAbs,avgSigned,sjCount,avgCount};
}
function buildUnits(){
  const units=[]; const cf=$("catSel").value, pf=$("panelSel").value;
  const cats=Object.keys(compData.puanlar||{}).filter(c=>!/^final_/.test(c)); // finaller ayri istersen kaldir
  const allCats=Object.keys(compData.puanlar||{});
  (cf?[cf]:allCats).forEach(cat=>{
    ["a","e"].forEach(panel=>{ if(pf&&panel!==pf) return;
      [1,2,3,4].forEach(pos=>{ const u=evalPosition(cat,panel,pos); if(u.n>0) units.push(u); });
    });
  });
  return units;
}

// ================= PDF =================
function drawUnit(doc, u, first){
  const PW=210, PH=297, MB=7, IN=MB+6;
  const catName=compData.kategoriler?.[u.cat]?.name||u.cat;
  const panelName=PANEL_LABEL[u.panel]||u.panel;
  const locYear=((compData.il||"")+" "+(compData.baslangicTarihi||compData.tarih||"").slice(0,4)).trim();
  const frame=()=>{ doc.setDrawColor(90); doc.setLineWidth(0.5); doc.roundedRect(MB,MB,PW-2*MB,PH-2*MB,2,2,"S"); doc.setLineWidth(0.2); };
  const foot=()=>{ const fy=PH-MB-9.5; doc.setDrawColor(215); doc.setLineWidth(0.3); doc.line(IN,fy,PW-IN,fy); doc.setLineWidth(0.2);
    doc.setFont(PDFFONT,"bold"); doc.setFontSize(7); doc.setTextColor(...NAVY); doc.text("TURKIYE CIMNASTIK FEDERASYONU", IN, fy+4);
    doc.setFont(PDFFONT,"normal"); doc.setFontSize(6.1); doc.setTextColor(140); doc.text("Aerobik Hakem Dogruluk Karnesi  |  Kontrol = Super Juri (SJA/SJE) notu, yoksa panel ortalamasi.  Sapma = Not - Kontrol.", IN, fy+7.3);
    doc.setFontSize(6.4); doc.setTextColor(140); doc.text("Rapor: "+reportDate, PW-IN, fy+4, {align:"right"}); };
  const hline=(yy)=>{ doc.setDrawColor(210); doc.setLineWidth(0.3); doc.line(IN,yy,PW-IN,yy); doc.setLineWidth(0.2); };
  const secH=(txt,yy)=>{ doc.setFillColor(...TCFRED); doc.rect(IN, yy-3.3, 1.5, 3.9, "F"); doc.setFont(PDFFONT,"bold"); doc.setFontSize(10.5); doc.setTextColor(...NAVY); doc.text(txt, IN+4, yy); };
  const newpage=()=>{ doc.addPage(); frame(); };

  if(!first) doc.addPage();
  frame();
  if(logoData){ try{ doc.addImage(logoData,"PNG", MB+4, MB+3, 13, 13); }catch(e){} }
  let y=MB+9;
  doc.setFont(PDFFONT,"bold"); doc.setFontSize(13.5); doc.setTextColor(...NAVY);
  doc.text("AEROBIC PANEL JUDGING REPORT", PW/2, y, {align:"center"}); y+=5;
  doc.setFont(PDFFONT,"normal"); doc.setFontSize(8.5); doc.setTextColor(110);
  doc.text(T("Turkiye Cimnastik Federasyonu - Aerobik Hakem Dogruluk Karnesi"), PW/2, y, {align:"center"}); y+=4.5;
  doc.setDrawColor(...TCFRED); doc.setLineWidth(0.9); doc.line(MB+4, y, PW-MB-4, y); doc.setLineWidth(0.2); y+=7;
  doc.setFont(PDFFONT,"bold"); doc.setFontSize(10.5); doc.setTextColor(...NAVY);
  doc.text(T(compData.isim||comp), IN, y); y+=5.5;
  if(locYear){ doc.setFont(PDFFONT,"normal"); doc.setFontSize(9.5); doc.setTextColor(60); doc.text(T(locYear), IN, y); y+=5; }
  y+=1; hline(y); y+=6;
  doc.setFont(PDFFONT,"bold"); doc.setFontSize(11); doc.setTextColor(...NAVY);
  doc.text(T(`${catName} - ${panelName} paneli`), IN, y); y+=6;
  doc.setFont(PDFFONT,"normal"); doc.setFontSize(8.5); doc.setTextColor(90);
  const refNote=u.sjCount>0?`Referans: Super Juri (${u.panel==="a"?"SJA":"SJE"}) - ${u.sjCount} sporcuda; panel ort. - ${u.avgCount} sporcuda`:"Referans: panel ortalamasi (Super Juri notu yok)";
  doc.text(T(refNote), IN, y); y+=6;
  hline(y); y+=6;
  doc.setFont(PDFFONT,"bold"); doc.setFontSize(12); doc.setTextColor(...NAVY);
  doc.text(`Panel pozisyonu: ${u.label}`, IN, y); y+=6.5;
  // KPI şeridi
  const [gLabel]=grade(u.acc);
  const ac=u.acc>=.7?[34,150,60]:u.acc>=.55?[180,140,0]:[200,60,40];
  const ky=y, usable=PW-2*IN, kgap=3.5, cw=(usable-2*kgap)/3;
  const kpi=(ci,label,val,vcol,sub)=>{ const x=IN+ci*(cw+kgap);
    doc.setDrawColor(223,227,234); doc.setFillColor(248,249,251); doc.setLineWidth(0.3); doc.roundedRect(x,ky,cw,16,1.8,1.8,"FD"); doc.setLineWidth(0.2);
    doc.setFillColor(...vcol); doc.roundedRect(x,ky,1.6,16,0.8,0.8,"F");
    doc.setFont(PDFFONT,"bold"); doc.setFontSize(6); doc.setTextColor(140); doc.text(label,x+4,ky+4.6);
    const vs=String(val); const fs=vs.length>7?9:vs.length>4?11:14; doc.setFont(PDFFONT,"bold"); doc.setFontSize(fs); doc.setTextColor(...vcol); doc.text(vs,x+4,ky+11);
    if(sub){ doc.setFont(PDFFONT,"normal"); doc.setFontSize(5.9); doc.setTextColor(150); doc.text(T(sub),x+4,ky+14.2); } };
  kpi(0,"EXERCISES",u.n,NAVY,"scored");
  kpi(1,"ACCURACY SCORE",u.acc.toFixed(2),ac,gLabel);
  kpi(2,"AVG DISCREPANCY",(u.avgSigned>=0?"+":"")+u.avgSigned.toFixed(2),u.avgAbs<0.15?[34,150,60]:u.avgAbs<0.3?[180,140,0]:[200,60,40],"signed mean");
  y=ky+16+7;
  secH("Accuracy per exercise", y); y+=7;

  // nokta grafiği
  const plotL=IN+40, plotR=PW-IN-30, legendX=plotR+5;
  let vals=[]; u.rows.forEach(r=>vals.push(r.ctrl,r.mark));
  let sMax=Math.ceil((Math.max(...vals)+0.15)*5)/5, sMin=Math.floor((Math.min(...vals)-0.15)*5)/5;
  if(sMax-sMin<0.6){ sMax+=0.3; sMin-=0.3; }
  const sx=s=>plotL+(sMax-s)/(sMax-sMin)*(plotR-plotL);
  const rowH=4.5, bottomLimit=PH-MB-14;
  const legend=(ly)=>{
    doc.setFont(PDFFONT,"normal"); doc.setFontSize(7); doc.setTextColor(60);
    doc.setFillColor(37,99,235); doc.circle(legendX+1.5, ly, 1.3, "F"); doc.text("Control (SJ/avg)", legendX+4, ly+1);
    let yy=ly+7; doc.setFont(PDFFONT,"bold"); doc.setFontSize(6.5); doc.text("Judging mark", legendX, yy); doc.text("discrepancy", legendX, yy+3.2); doc.setFont(PDFFONT,"normal"); yy+=7;
    [["Very high",[183,28,28]],["High",[211,47,47]],["Moderate",[141,110,99]],["Average",[158,157,36]],["Low",[139,195,74]],["None",[34,197,94]]].forEach(([lab,col])=>{ doc.setFillColor(...col); doc.circle(legendX+1.5, yy, 1.3, "F"); doc.setTextColor(60); doc.setFont(PDFFONT,"normal"); doc.setFontSize(6.5); doc.text(lab, legendX+4, yy+1); yy+=4.2; });
  };
  const _range=sMax-sMin, _lblStep=_range>4?1:_range>2?0.5:0.2;
  const ticks=(topY,botY)=>{
    doc.setDrawColor(235); doc.setLineWidth(0.15);
    for(let s=Math.ceil(sMin/0.2)*0.2; s<=sMax+1e-9; s+=0.2){ const x=sx(s); doc.line(x,topY,x,botY); }
    doc.setFont(PDFFONT,"normal"); doc.setFontSize(6.5); doc.setTextColor(110);
    doc.text("Judging mark / control", (plotL+plotR)/2, topY-3.5, {align:"center"});
    for(let s=Math.ceil(sMin/_lblStep)*_lblStep; s<=sMax+1e-9; s+=_lblStep){ const x=sx(s); doc.text(s.toFixed(1), x, topY-0.8, {align:"center"}); }
    doc.setDrawColor(150); doc.setLineWidth(0.25); doc.rect(plotL,topY,plotR-plotL,botY-topY,"S");
  };
  let idx=0, segTop=y+3, legDrawn=false;
  while(idx<u.rows.length){
    if(idx>0){ newpage(); segTop=MB+16; }
    const perPage=Math.max(1, Math.floor((bottomLimit-segTop)/rowH));
    const end=Math.min(u.rows.length, idx+perPage);
    const botY=segTop+(end-idx)*rowH;
    ticks(segTop, botY);
    if(!legDrawn){ legend(segTop+3); legDrawn=true; }
    for(let k=idx;k<end;k++){
      const r=u.rows[k], ry=segTop+(k-idx)*rowH+rowH/2;
      doc.setFont(PDFFONT,"normal"); doc.setFontSize(6); doc.setTextColor(50,50,50);
      doc.text(T(r.name).slice(0,26), plotL-2, ry+0.6, {align:"right"});
      doc.setFillColor(37,99,235); doc.circle(sx(r.ctrl), ry, 1.15, "F");
      doc.setFillColor(...discColor(r.disc)); doc.circle(sx(r.mark), ry, 1.15, "F");
    }
    doc.setFont(PDFFONT,"normal"); doc.setFontSize(6.5); doc.setTextColor(110);
    doc.text("Judging mark / control", (plotL+plotR)/2, botY+3.5, {align:"center"});
    idx=end; segTop=botY+9;
  }
  // Out of consensus
  let y2=segTop+3;
  if(y2>PH-MB-55){ newpage(); y2=MB+16; }
  secH("Out of consensus (|sapma| > 0.7)", y2); y2+=6;
  const ooc=u.rows.filter(r=>Math.abs(r.disc)>0.7);
  if(ooc.length===0){ doc.setFont(PDFFONT,"normal"); doc.setFontSize(9); doc.setTextColor(90); doc.text("None", IN, y2); y2+=8; }
  else {
    doc.autoTable({ startY:y2, head:[["Athlete","Club / City","Control","Judging mark","Discrepancy","Ref"]],
      body:ooc.map(r=>[T(r.name),T((r.okul||"")+(r.il?" / "+r.il:"")),r.ctrl.toFixed(2),r.mark.toFixed(2),(r.disc>=0?"+":"")+r.disc.toFixed(2),r.refSrc]),
      styles:{font:PDFFONT,fontSize:7.5,cellPadding:1.3,textColor:30}, headStyles:{fillColor:[130,45,45],textColor:255,fontSize:7,fontStyle:"bold"},
      columnStyles:{2:{halign:"center"},3:{halign:"center"},4:{halign:"center"},5:{halign:"center"}}, margin:{left:IN,right:IN} });
    y2=doc.lastAutoTable.finalY+7;
  }
  foot();
}

function makePDF(units, filename){
  if(!units.length){ toast("Karne verisi yok"); return; }
  const { jsPDF }=window.jspdf;
  const doc=new jsPDF({unit:"mm",format:"a4"});
  if(fontReg&&fontBold){ try{ doc.addFileToVFS("DejaVuSans.ttf",fontReg); doc.addFont("DejaVuSans.ttf","DejaVu","normal"); doc.addFileToVFS("DejaVuSans-Bold.ttf",fontBold); doc.addFont("DejaVuSans-Bold.ttf","DejaVu","bold"); PDFFONT="DejaVu"; doc.setFont("DejaVu","normal"); }catch(e){ PDFFONT="helvetica"; } } else { PDFFONT="helvetica"; }
  units.forEach((u,i)=>drawUnit(doc,u,i===0));
  doc.save(filename);
}

// ---- UI ----
onValue(ref(db,BASE), s=>{
  comps=s.val()||{};
  const es=Object.entries(comps).filter(([id,c])=>c&&c.puanlar).sort((a,b)=>String((b[1].baslangicTarihi||b[1].tarih||"")).localeCompare(String(a[1].baslangicTarihi||a[1].tarih||"")));
  const sel=$("compSel");
  sel.innerHTML='<option value="">— Yarışma seçin —</option>'+es.map(([id,c])=>`<option value="${id}">${esc(c.isim||c.ad||id)}</option>`).join("");
  const want=comp||params.get("comp")||params.get("competitionId")||params.get("compId")||"";
  if(want&&comps[want]){ sel.value=want; if(want!==comp){ comp=want; loadComp(); } }
});
$("compSel").addEventListener("change",e=>{ comp=e.target.value; loadComp(); });
$("catSel").addEventListener("change",render);
$("panelSel").addEventListener("change",render);

async function loadComp(){
  $("list").innerHTML='<div class="notice">Yükleniyor…</div>'; $("allBtn").disabled=true;
  if(!comp){ $("list").innerHTML='<div class="notice">Yarışma seçin</div>'; return; }
  const cSnap=await get(ref(db,`${BASE}/${comp}`));
  compData=cSnap.val()||{};
  const cats=Object.keys(compData.puanlar||{});
  $("catSel").innerHTML='<option value="">Tüm kategoriler</option>'+cats.map(c=>`<option value="${c}">${esc(compData.kategoriler?.[c]?.name||c)}</option>`).join("");
  render();
}
let currentUnits=[];
function render(){
  if(!compData) return;
  currentUnits=buildUnits();
  $("allBtn").disabled=currentUnits.length===0;
  $("count").textContent=`${currentUnits.length} pozisyon karnesi`;
  if(!currentUnits.length){ $("list").innerHTML='<div class="notice">Bu yarışmada panel notu bulunamadı.</div>'; return; }
  $("list").innerHTML=`<table><thead><tr><th>Panel/Poz.</th><th>Kategori</th><th class="num">Egz.</th><th class="num">Ort. Sapma</th><th class="num">Accuracy</th><th>Referans</th><th></th></tr></thead><tbody>${
    currentUnits.map((u,i)=>{ const [gl,gc]=gradeShort(u.acc); const pt=u.panel==="a"?"tag-a":"tag-e"; const refT=u.sjCount>0?`<span class="tag tag-sj">SJ ${u.sjCount}</span>`+(u.avgCount>0?` <span class="tag tag-avg">ort ${u.avgCount}</span>`:''):`<span class="tag tag-avg">panel ort.</span>`;
      return `<tr><td><span class="tag ${pt}">${u.label}</span></td><td style="color:var(--muted)">${esc(compData.kategoriler?.[u.cat]?.name||u.cat)}</td><td class="num">${u.n}</td><td class="num">${(u.avgSigned>=0?"+":"")+u.avgSigned.toFixed(3)}</td><td class="num"><span class="pill ${gc}">${u.acc.toFixed(2)} · ${gl}</span></td><td>${refT}</td><td><button class="rowbtn" data-i="${i}">PDF</button></td></tr>`;
    }).join("")
  }</tbody></table>`;
  $("list").querySelectorAll(".rowbtn").forEach(b=>b.addEventListener("click",()=>{ const u=currentUnits[+b.dataset.i]; makePDF([u], `AerobikKarne_${tr(compData.kategoriler?.[u.cat]?.name||u.cat).replace(/\s+/g,"_")}_${u.label}.pdf`); }));
}
$("allBtn").addEventListener("click",()=>{ if(currentUnits.length) makePDF(currentUnits, `Aerobik_FIG_Karneleri_${tr(compData.isim||comp).replace(/[^a-zA-Z0-9]+/g,"_").slice(0,40)}.pdf`); });
</script>
