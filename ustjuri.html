<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ÜST JÜRİ PANELİ — TCF</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e1a;--panel:#131a2b;--panel2:#1b2438;--line:#2a3550;
  --txt:#e8edf7;--muted:#8b97b3;--accent:#6366f1;--accent2:#818cf8;
  --go:#22c55e;--finishing:#f59e0b;--scored:#3b82f6;--wait:#64748b;--warn:#ef4444;
  --spread-ok:#22c55e;--spread-warn:#f59e0b;--spread-bad:#ef4444;
}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:rgba(10,14,26,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:.7rem 1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.55rem;font-weight:800;font-size:1.05rem;letter-spacing:.02em}
.brand .material-icons-round{color:var(--accent2)}
.selects{display:flex;gap:.6rem;flex-wrap:wrap;margin-left:auto;align-items:center}
select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:.5rem .8rem;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;max-width:260px}
select:focus{outline:2px solid var(--accent)}
.livedot{width:9px;height:9px;border-radius:50%;background:var(--go);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.hint{color:var(--muted);font-size:.8rem;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1rem;padding:1rem;max-width:1600px;margin:0 auto}
.grid.cols-1{grid-template-columns:1fr;max-width:640px}
.grid.cols-2{grid-template-columns:repeat(2,1fr);max-width:900px}
.grid.cols-4{grid-template-columns:repeat(2,1fr)}
@media(min-width:1200px){.grid.cols-4{grid-template-columns:repeat(4,1fr);max-width:100%}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-height:280px}
.panel.locked{border-color:var(--warn);box-shadow:0 0 0 2px rgba(239,68,68,.25)}
.p-head{display:flex;align-items:center;justify-content:space-between;padding:.7rem .9rem;background:var(--panel2);border-bottom:1px solid var(--line)}
.p-alet{font-weight:800;font-size:1rem;letter-spacing:.02em}
.p-state{font-size:.68rem;font-weight:800;padding:.25rem .55rem;border-radius:999px;text-transform:uppercase;letter-spacing:.05em;background:var(--wait);color:#fff}
.p-state.go{background:var(--go)}.p-state.finishing{background:var(--finishing)}.p-state.scored{background:var(--scored)}.p-state.wait{background:var(--wait)}.p-state.fall{background:var(--warn)}
.p-body{padding:.9rem;display:flex;flex-direction:column;gap:.7rem;flex:1}
.ath{min-height:2.4rem}
.ath-name{font-weight:800;font-size:1.15rem;line-height:1.15}
.ath-club{color:var(--muted);font-size:.8rem;font-weight:600;margin-top:.15rem}
.ath-empty{color:var(--muted);font-size:.9rem;font-weight:600;font-style:italic;padding:.6rem 0}
.scores{display:grid;grid-template-columns:auto 1fr;gap:.35rem .7rem;align-items:center}
.d-row{display:flex;align-items:baseline;gap:.5rem;padding:.4rem .6rem;background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.3);border-radius:10px}
.d-lbl{font-size:.7rem;font-weight:800;color:var(--accent2);letter-spacing:.05em}
.d-val{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.e-wrap{display:flex;flex-direction:column;gap:.35rem}
.e-title{font-size:.7rem;font-weight:800;color:var(--muted);letter-spacing:.05em}
.e-chips{display:flex;gap:.4rem;flex-wrap:wrap}
.e-chip{display:flex;flex-direction:column;align-items:center;min-width:52px;padding:.35rem .3rem;background:var(--panel2);border:1px solid var(--line);border-radius:9px}
.e-chip .k{font-size:.6rem;font-weight:800;color:var(--muted)}
.e-chip .v{font-size:1.05rem;font-weight:800;font-variant-numeric:tabular-nums;margin-top:.1rem}
.e-chip.hi{border-color:var(--spread-bad);color:var(--spread-bad)}
.e-chip.lo{border-color:var(--scored)}
.e-chip.empty .v{color:var(--muted);opacity:.5}
.spread{display:flex;align-items:center;justify-content:space-between;padding:.4rem .6rem;border-radius:9px;font-size:.78rem;font-weight:700;background:var(--panel2)}
.spread .s-val{font-weight:800;font-variant-numeric:tabular-nums}
.spread.ok{color:var(--spread-ok)}.spread.warn{color:var(--spread-warn);background:rgba(245,158,11,.1)}.spread.bad{color:var(--spread-bad);background:rgba(239,68,68,.12)}
.final{display:flex;align-items:baseline;justify-content:space-between;padding:.5rem .7rem;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.3);border-radius:10px;margin-top:.1rem}
.final .fl{font-size:.72rem;font-weight:800;color:var(--muted);letter-spacing:.05em}
.final .fv{font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums}
.p-foot{padding:.7rem .9rem;border-top:1px solid var(--line);margin-top:auto}
.btn-mud{width:100%;display:flex;align-items:center;justify-content:center;gap:.4rem;padding:.7rem;border:none;border-radius:11px;font:inherit;font-weight:800;font-size:.9rem;cursor:pointer;transition:.15s;background:var(--warn);color:#fff}
.btn-mud:hover{filter:brightness(1.1)}
.btn-mud.active{background:var(--go);color:#fff}
.lock-banner{display:none;align-items:center;gap:.4rem;background:rgba(239,68,68,.15);color:var(--warn);font-weight:800;font-size:.78rem;padding:.45rem .6rem;border-radius:9px;margin-bottom:.5rem}
.panel.locked .lock-banner{display:flex}
.empty-state{text-align:center;color:var(--muted);padding:4rem 1rem;font-weight:600}
.empty-state .material-icons-round{font-size:3rem;opacity:.4;display:block;margin-bottom:.8rem}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><span class="material-icons-round">gavel</span> ÜST JÜRİ PANELİ</div>
  <div class="selects">
    <span class="livedot" id="liveDot" title="Canlı"></span>
    <select id="compSelect"><option value="">Yarışma yükleniyor…</option></select>
    <select id="catSelect"><option value="">Önce yarışma seçin</option></select>
  </div>
</div>
<div id="grid" class="grid"></div>
<div id="emptyState" class="empty-state"><span class="material-icons-round">sports_gymnastics</span>Yarışma ve kategori seçin</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set, off } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDRcNy7IwpKhpYgRlaoo5BD8FL4myhklYY",
  authDomain: "analig.firebaseapp.com",
  databaseURL: "https://analig-default-rtdb.firebaseio.com",
  projectId: "analig",
  storageBucket: "analig.firebasestorage.app",
  messagingSenderId: "724523220392",
  appId: "1:724523220392:web:5141cbdb98d5c85f9cb19d"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// Artistik yarışmalar 'competitions' node'unda (firebasePath). Diğer branşlar farklı; şimdilik artistik.
const FB_PATH = "competitions";
const ALET_TR = { yer:"YER", atlama:"ATLAMA", paralel:"PARALEL", barfiks:"BARFİKS", halka:"HALKA", kulplu:"KULPLU", mantar:"MANTAR", denge:"DENGE", asimetrik:"ASİMETRİK" };
const STATE_TR = { go:"SERİ", fall:"DÜŞME", finishing:"NOT GİRİŞİ", scored:"PUANLANDI", wait:"BEKLEMEDE", idle:"—" };
const SPREAD_WARN = 0.3, SPREAD_BAD = 0.5;

const $ = id => document.getElementById(id);
let comps = {}, curComp = "", curCat = "", panelUnsubs = [];

function clearPanels(){ panelUnsubs.forEach(fn=>{try{fn()}catch(e){}}); panelUnsubs=[]; $("grid").innerHTML=""; }

// --- Yarışmaları yükle ---
onValue(ref(db, FB_PATH), snap => {
  comps = snap.val() || {};
  const entries = Object.entries(comps)
    .filter(([id,c]) => c && (c.kategoriler))
    .sort((a,b) => (b[1].baslangicTarihi||"").localeCompare(a[1].baslangicTarihi||""));
  const sel = $("compSelect");
  const prev = sel.value;
  sel.innerHTML = '<option value="">— Yarışma seçin —</option>' +
    entries.map(([id,c])=>`<option value="${id}">${(c.isim||c.ad||id).replace(/</g,"&lt;")}</option>`).join("");
  if(prev && comps[prev]) sel.value = prev;
});

$("compSelect").addEventListener("change", e => {
  curComp = e.target.value; curCat = "";
  const cats = curComp && comps[curComp]?.kategoriler ? comps[curComp].kategoriler : {};
  const cs = $("catSelect");
  cs.innerHTML = '<option value="">— Kategori seçin —</option>' +
    Object.entries(cats).map(([k,v])=>`<option value="${k}">${(v.name||v.ad||k).replace(/</g,"&lt;")}</option>`).join("");
  clearPanels(); $("emptyState").style.display = "block";
});

$("catSelect").addEventListener("change", e => {
  curCat = e.target.value;
  buildPanels();
});

function buildPanels(){
  clearPanels();
  if(!curComp || !curCat){ $("emptyState").style.display="block"; return; }
  $("emptyState").style.display="none";
  const cat = comps[curComp].kategoriler[curCat];
  let aletler = cat?.aletler || [];
  if(!Array.isArray(aletler)) aletler = Object.keys(aletler||{});
  // ATLAMA, ASİMETRİK'ten önce gelsin (FIG yarışma sırası: VT → UB → BB → FX).
  // DB'de aletler alfabetik kayıtlı olduğu için burada yerleri değiştiriliyor.
  aletler = [...aletler];
  const _iAt = aletler.indexOf("atlama"), _iAs = aletler.indexOf("asimetrik");
  if(_iAt > -1 && _iAs > -1 && _iAs < _iAt){
    aletler[_iAt] = "asimetrik"; aletler[_iAs] = "atlama";
  }
  const grid = $("grid");
  grid.className = "grid cols-" + (aletler.length>=4 ? "4" : aletler.length);
  aletler.forEach(alet => grid.appendChild(makePanel(alet)));
}

function makePanel(alet){
  const el = document.createElement("div");
  el.className = "panel";
  el.innerHTML = `
    <div class="p-head"><span class="p-alet">${ALET_TR[alet]||alet.toUpperCase()}</span><span class="p-state wait">—</span></div>
    <div class="p-body">
      <div class="lock-banner"><span class="material-icons-round" style="font-size:1rem">lock</span> ÜST JÜRİ KONTROLÜNDE</div>
      <div class="ath"><div class="ath-empty">Sporcu bekleniyor…</div></div>
      <div class="d-row"><span class="d-lbl">D NOTU</span><span class="d-val">—</span></div>
      <div class="e-wrap"><span class="e-title">E NOTLARI (kesinti)</span><div class="e-chips"></div></div>
      <div class="spread ok"><span>E FARKI</span><span class="s-val">—</span></div>
      <div class="final"><span class="fl">TOPLAM</span><span class="fv">—</span></div>
    </div>
    <div class="p-foot"><button class="btn-mud"><span class="material-icons-round mud-icon" style="font-size:1.1rem">pan_tool</span> <span class="mud-label">MÜDAHALE ET</span></button></div>`;

  const stateEl = el.querySelector(".p-state");
  const athEl = el.querySelector(".ath");
  const dVal = el.querySelector(".d-val");
  const eChips = el.querySelector(".e-chips");
  const spreadEl = el.querySelector(".spread");
  const finalEl = el.querySelector(".fv");
  const btn = el.querySelector(".btn-mud");

  const boardRef = ref(db, `${FB_PATH}/${curComp}/board/${curCat}/${alet}`);
  const lockRef  = ref(db, `${FB_PATH}/${curComp}/board/${curCat}/${alet}/ustJuriKilit`);
  let curAthId = null, scoreUnsub = null;

  const bcb = onValue(boardRef, snap => {
    const b = snap.val() || {};
    const st = b.state || "idle";
    stateEl.textContent = STATE_TR[st] || st.toUpperCase();
    stateEl.className = "p-state " + st;
    // lock
    const lk = !!b.ustJuriKilit;
    el.classList.toggle("locked", lk);
    btn.classList.toggle("active", lk);
    el.querySelector(".mud-label").textContent = lk ? "DEVAM ET" : "MÜDAHALE ET";
    el.querySelector(".mud-icon").textContent = lk ? "play_arrow" : "pan_tool";
    // sporcu
    if(b.athId){
      athEl.innerHTML = `<div class="ath-name">${(b.athName||"Sporcu").replace(/</g,"&lt;")}</div><div class="ath-club">${(b.athClub||b.kulup||"").replace(/</g,"&lt;")}</div>`;
    } else {
      athEl.innerHTML = `<div class="ath-empty">Sporcu bekleniyor…</div>`;
    }
    // skor aboneliği (athId değişince)
    if(b.athId !== curAthId){
      curAthId = b.athId;
      if(scoreUnsub){ try{scoreUnsub()}catch(e){} scoreUnsub=null; }
      resetScores();
      if(curAthId){
        const sRef = ref(db, `${FB_PATH}/${curComp}/puanlar/${curCat}/${alet}/${curAthId}`);
        scoreUnsub = onValue(sRef, s => renderScores(s.val()||{}));
      }
    }
  });

  function resetScores(){ dVal.textContent="—"; eChips.innerHTML=""; spreadEl.querySelector(".s-val").textContent="—"; spreadEl.className="spread ok"; finalEl.textContent="—"; }

  function renderScores(sc){
    dVal.textContent = (sc.dScore!=null) ? Number(sc.dScore).toFixed(2) : "—";
    const es = [1,2,3,4].map(i => sc["e"+i]);
    const vals = es.filter(v => v!=null).map(Number);
    const mx = vals.length?Math.max(...vals):null, mn = vals.length?Math.min(...vals):null;
    eChips.innerHTML = es.map((v,i)=>{
      if(v==null) return `<div class="e-chip empty"><span class="k">E${i+1}</span><span class="v">—</span></div>`;
      const cls = vals.length>1 && Number(v)===mx ? "hi" : (vals.length>1 && Number(v)===mn ? "lo" : "");
      return `<div class="e-chip ${cls}"><span class="k">E${i+1}</span><span class="v">${Number(v).toFixed(1)}</span></div>`;
    }).join("");
    const sv = spreadEl.querySelector(".s-val");
    if(vals.length>=2){
      const sp = +(mx-mn).toFixed(2);
      sv.textContent = sp.toFixed(2);
      spreadEl.className = "spread " + (sp>=SPREAD_BAD?"bad":sp>=SPREAD_WARN?"warn":"ok");
    } else { sv.textContent = vals.length?"tek E":"—"; spreadEl.className="spread ok"; }
    finalEl.textContent = (sc.finalScore!=null||sc.sonuc!=null) ? Number(sc.finalScore??sc.sonuc).toFixed(3).replace(/0+$/,"").replace(/\.$/,"") : "—";
  }

  btn.addEventListener("click", async () => {
    const currentlyLocked = el.classList.contains("locked");
    try { await set(lockRef, !currentlyLocked ? true : null); }
    catch(e){ alert("İşlem başarısız: "+(e?.message||e)); }
  });

  panelUnsubs.push(()=>{ try{off(boardRef)}catch(e){}; if(scoreUnsub){try{scoreUnsub()}catch(e){}} });
  return el;
}
</script>
</body>
</html>
